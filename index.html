으로 새로운 게시글 객체를 생성하는 코드로 알맞은 것은?", "o": ["`Post.new(title=\"New Post\")`", "`Post.make(title=\"New Post\")`", "`Post.objects.create(title=\"New Post\")`", "`Post.objects.add(title=\"New Post\")`"], "a": "c", "e": "`Post.objects.create()`는 새 레코드를 생성하고 저장하는 데 사용된다."}, {"q": "모든 게시글을 조회하기 위한 Django ORM 코드는?", "o": ["`Post.all()`", "`Post.objects()`", "`Post.objects.get()`", "`Post.objects.all()`"], "a": "d", "e": "`Post.objects.all()`은 해당 모델의 모든 객체를 반환한다."}, {"q": "게시글 ID가 1인 객체의 제목을 수정하는 올바른 코드 조합은?", "o": ["`Post.objects.set(id=1, title=\"수정됨\")`", "`Post.objects.get(id=1).update(title=\"수정됨\")`", "`Post.update(id=1, title=\"수정됨\")`", "`post = Post.objects.get(id=1)` → `post.title=\"수정됨\"` → `post.save()`"], "a": "d", "e": "객체를 조회하고 필드를 수정한 후 `.save()`로 반영하는 것이 일반적인 방법이다."}, {"q": "게시글 하나를 삭제하는 가장 알맞은 방법은?", "o": ["`Post.objects.delete(id=1)`", "`Post.objects.get(id=1).delete()`", "`Post.remove(id=1)`", "`delete Post where id=1`"], "a": "b", "e": "객체를 `get()`으로 조회한 다음 `.delete()` 메서드를 호출해 삭제할 수 있다."}, {"q": "제목이 정확히 \"Welcome\"인 게시글만 조회하고 싶을 때 알맞은 쿼리는?", "o": ["`Post.objects.filter(title=\"Welcome\")`", "`Post.objects.filter(title__contains=\"Welcome\")`", "`Post.objects.get(title__startswith=\"Welcome\")`", "`Post.objects.exclude(title=\"Welcome\")`"], "a": "a", "e": "조건 없이 문자열과 정확히 일치할 때는 필드명만 써도 되며, `title=\"Welcome\"`은 title이 정확히 \"Welcome\"인 값을 찾는다."}, {"q": "제목에 \"Django\"라는 단어가 포함된 게시글을 조회하는 코드는?", "o": ["`Post.objects.filter(title__has=\"Django\")`", "`Post.objects.filter(title_contains=\"Django\")` (밑줄 1개)", "`Post.objects.filter(title__contains=\"Django\")`", "`Post.objects.get(title__contains=\"Django\")`"], "a": "c", "e": "`field__contains`는 해당 필드에 특정 문자열이 포함된 객체를 조회할 수 있다."}, {"q": "Django ORM을 사용하는 주요 장점 중 옳지 않은 것은?", "o": ["코드의 가독성이 높아진다", "SQL Injection의 위험을 줄인다", "모든 쿼리를 수동으로 작성해야 한다", "다양한 데이터베이스에 대해 추상화된 접근이 가능하다"], "a": "c", "e": "ORM의 주요 이점 중 하나는 쿼리를 자동으로 생성해주는 기능으로, 직접 작성할 필요가 줄어든다."}, {"q": "작성자가 'anonymous'인 게시글을 모두 삭제하는 가장 적절한 방법은?", "o": ["`Post.delete(author=\"anonymous\")`", "`Post.objects.filter(author=\"anonymous\").delete()`", "`Post.remove(author=\"anonymous\")`", "`Post.objects.get(author=\"anonymous\").delete_all()`"], "a": "b", "e": "`.filter()`로 조건에 맞는 객체들을 선택하고, `.delete()`를 호출하면 해당 객체들이 모두 삭제된다."}, {"q": "다음 중 게시글 제목을 일괄 변경할 때 사용할 수 있는 QuerySet API는?", "o": ["`update()`", "`set()`", "`save_all()`", "`apply()`"], "a": "a", "e": "`update()` 메서드는 필터링된 QuerySet에 대해 필드 값을 일괄적으로 수정할 때 사용된다."}, {"q": "전체 게시글을 삭제하려면 어떤 코드를 사용할까?", "o": ["`Post.delete()`", "`Post.remove_all()`", "`Post.objects.all().delete()`", "`Post.objects.clear()`"], "a": "c", "e": "`Post.objects.all()`은 전체 객체를 선택하고, `.delete()`는 이를 삭제한다."}, {"q": "다음 중 `Post.objects.all()`과 `Post.objects.get(id=1)`의 리턴값에 대한 설명으로 옳은 것은?", "o": ["둘 다 단일 객체를 반환한다", "둘 다 QuerySet을 반환한다", "`all()`은 QuerySet을 반환하고, `get()`은 단일 객체를 반환한다", "`get()`은 리스트를 반환하고, `all()`은 None을 반환한다"], "a": "c", "e": "`all()`은 여러 객체가 담긴 QuerySet을 반환하고, `get()`은 조건에 일치하는 하나의 객체만 반환한다. `get()` 결과는 QuerySet이 아닌 모델 인스턴스다."}], "date": "10/16"}, {"id": "1019", "title": "Django ORM with View", "qs": [{"q": "GET 메서드의 특징으로 옳은 것은?", "o": ["요청 본문(Body)에 데이터를 담아 전송한다", "서버 상태를 변경하는 작업에 주로 사용된다", "응답 결과를 브라우저가 캐시할 수 있다", "브라우저 기록(History)에 남지 않는다"], "a": "c", "e": "GET은 주로 조회에 사용되며, 동일 URL에 재요청 시 브라우저 캐시를 활용할 수 있다."}, {"q": "POST 메서드를 사용해야 하는 가장 적절한 상황은?", "o": ["데이터 조회", "새 게시글 작성", "정적 파일 다운로드", "단순 페이지 이동"], "a": "b", "e": "POST는 서버의 리소스를 생성·수정·삭제하는 요청에 사용되며, 게시글 작성이 대표적이다."}, {"q": "HTTP 상태 코드 403 Forbidden이 의미하는 것은?", "o": ["요청이 성공적으로 처리되었다", "리소스를 찾을 수 없다", "권한 문제로 요청이 거절되었다", "서버 오류가 발생하였다"], "a": "c", "e": "403은 서버가 요청을 이해했으나 권한 부족 등으로 거부했음을 나타낸다."}, {"q": "Django에서 CSRF 토큰을 사용하는 주된 목적은?", "o": ["데이터 압축", "사이트 간 요청 위조 방지", "정적 자원 캐싱", "URL 라우팅 단축"], "a": "b", "e": "CSRF 토큰은 사용자가 의도하지 않은 악의적 POST 요청을 차단하는 보안 장치이다."}, {"q": "`redirect()` 함수가 `render()`와 다른 점으로 옳은 것은?", "o": ["템플릿을 직접 렌더링한다", "클라이언트에게 다른 URL로 다시 요청하라는 응답을 준다", "데이터베이스 세션을 초기화한다", "HTTP 404 오류를 발생시킨다"], "a": "b", "e": "`redirect()`는 3xx 응답을 보내어 브라우저가 지정된 URL로 GET 요청을 다시 보내도록 유도한다."}, {"q": "`Article.objects.create()` 메서드의 특징으로 옳은 것은?", "o": ["인스턴스를 생성하지만 저장은 하지 않는다", "객체를 만들고 즉시 DB에 저장한다", "특정 조건에 맞는 객체를 조회한다", "기존 객체를 삭제한다"], "a": "b", "e": "`create()`는 객체를 만들면서 `save()`까지 한 번에 수행한다."}, {"q": "URL에 데이터가 노출되는 전송 방식은?", "o": ["GET", "POST", "둘 다", "둘 다 아님"], "a": "a", "e": "GET은 쿼리 문자열로 데이터를 전달하므로 URL에 보인다. POST는 HTTP Body에 담는다."}, {"q": "캐시(Cache) 활용 시 기대할 수 있는 이점이 아닌 것은?", "o": ["페이지 응답 속도 향상", "서버 부하 감소", "데이터 무결성 자동 보장", "반복 조회 시 네트워크 비용 절감"], "a": "c", "e": "캐시는 성능과 비용 측면에서 유리하지만 데이터 변경 시 일관성 관리가 필요하다."}, {"q": "URL 패턴 `<int:pk>/` 의 주된 용도는?", "o": ["새 글 작성 페이지로 이동", "글 번호를 받아 해당 글 상세 페이지로 라우팅", "정적 파일 제공", "전체 글 목록 출력"], "a": "b", "e": "`<int:pk>`는 정수형 기본키 값을 캡처하여 detail view처럼 특정 객체 상세 조회에 사용한다."}, {"q": "모든 Article 레코드를 조회하여 QuerySet을 반환하는 메서드는?", "o": ["`get()`", "`filter()`", "`all()`", "`delete()`"], "a": "c", "e": "`all()`은 조건 없이 테이블의 모든 레코드를 담은 QuerySet을 돌려준다."}, {"q": "HTTP 404 Not Found 응답을 반환해야 하는 가장 적절한 상황은?", "o": ["사용자가 인증되지 않았다", "서버 내부 로직 오류로 처리에 실패했다", "클라이언트가 요청한 URL에 해당하는 리소스가 존재하지 않는다", "클라이언트의 요청 본문 형식이 잘못되었다"], "a": "c", "e": "404는 요청한 URL에 해당하는 리소스(페이지나 데이터)가 서버에 존재하지 않을 때 사용한다. (예: 존재하지 않는 게시글 번호로 접근)"}, {"q": "`objects.get()` 메서드에 대한 설명으로 옳은 것은?", "o": ["조건에 맞는 모든 레코드를 QuerySet으로 반환한다", "조건과 일치하는 단 하나의 객체를 반환하며, 없으면 DoesNotExist 예외를 발생시킨다", "항상 새로운 객체를 생성하고 저장한다", "조건이 여러 개여도 예외 없이 첫 번째 객체만 반환한다"], "a": "b", "e": "`get()`은 단일 객체 조회 전용이며, 결과가 없거나 2개 이상이면 예외를 발생시킨다."}], "date": "10/19"}, {"id": "1020F", "title": "Django Form", "qs": [{"q": "다음 중 Django Form이 하는 일로 옳지 않은 것은?", "o": ["데이터 입력 화면 생성", "데이터 유효성 검사", "데이터 자동 저장 처리", "데이터베이스에 접속하여 직접 테이블 삭제"], "a": "d", "e": "Django Form은 사용자로부터 입력받은 데이터의 화면 표시, 유효성 검사, 데이터 처리를 담당하지만, 데이터베이스의 테이블을 직접 삭제하는 기능은 제공하지 않습니다. 테이블 삭제와 같은 작업은 데이터베이스 관리자의 권한으로 Django의 Form 클래스와는 관련이 없습니다."}, {"q": "ModelForm과 일반 Form의 차이에 대해 옳은 것은?", "o": ["ModelForm은 DB와 연결되지 않는다.", "일반 Form은 DB에 데이터를 저장할 때 사용한다.", "ModelForm은 Model과 연결되어 있어 입력 데이터를 DB에 저장할 수 있다.", "일반 Form은 자동 유효성 검사를 지원하지 않는다."], "a": "c", "e": "ModelForm은 Django의 모델(Model)과 직접 연결되어 있어 데이터베이스에 저장하거나 수정할 때 편리하게 사용할 수 있습니다. 일반 Form은 Model과 연결되지 않고 단지 입력값 수집 및 유효성 검사만 처리합니다."}, {"q": "다음 중 Django Form의 유효성 검사를 수행하는 메서드는?", "o": ["`save()`", "`is_valid()`", "`redirect()`", "`render()`"], "a": "b", "e": "Django Form의 `is_valid()` 메서드는 사용자 입력 데이터가 유효한 형식인지 검사하는 기능을 제공합니다. `save()` 메서드는 유효성 검사를 통과한 후 데이터를 저장할 때 사용하는 메서드입니다."}, {"q": "Form의 입력 필드를 화면에 렌더링할 때 사용하는 옵션 중, 각 필드를 `<p>` 태그로 감싸주는 옵션은?", "o": ["`{{form.as_ul}}`", "`{{form.as_table}}`", "`{{form.as_p}}`", "`{{form.as_render}}`"], "a": "c", "e": "Django의 Form 클래스에서 `{{ form.as_p }}`를 사용하면 각 입력 필드를 자동으로 `<p>` 태그로 감싸서 화면에 출력합니다. 이 외에 as_ul, as_table 같은 다른 옵션도 존재하지만, `<p>` 태그를 사용하는 것은 as_p입니다."}, {"q": "Django에서 사용자 입력 데이터를 저장하거나 수정할 때 사용하는 메서드는?", "o": ["`update()`", "`create()`", "`save()`", "`delete()`"], "a": "c", "e": "Django의 ModelForm은 `save()` 메서드를 사용하여 데이터를 데이터베이스에 저장하거나 기존 데이터를 수정합니다. `create()`, `update()`, `delete()`는 Django 모델의 메서드로 사용될 수 있지만 Form에서 데이터를 처리할 때는 사용하지 않습니다."}, {"q": "Django Form 클래스의 기본 구조에서 HTML의 입력 요소를 조정할 때 사용하는 것은?", "o": ["model", "widget", "validator", "queryset"], "a": "b", "e": "Form 클래스에서 HTML 입력 요소의 스타일이나 추가 속성(placeholder, class 등)을 지정할 때 Widget을 사용합니다. Widget을 통해 입력 필드가 HTML에서 어떻게 렌더링될지 세부적으로 조정할 수 있습니다."}, {"q": "Django의 ModelForm에서 사용할 필드를 선택적으로 제외할 때 사용하는 Meta 클래스 속성은?", "o": ["fields", "exclude", "remove", "drop"], "a": "b", "e": "Django ModelForm에서 Meta 클래스의 exclude 속성은 폼에서 제외하고 싶은 필드를 지정하는 데 사용됩니다. 반면 fields 속성은 포함할 필드를 명시적으로 정의할 때 사용합니다."}, {"q": "다음 중 Django Form에서 입력값이 유효하지 않을 때 발생하는 동작으로 가장 알맞은 것은?", "o": ["서버가 500 에러를 반환한다.", "Form 객체가 생성되지 않는다", "`is_valid()`는 False를 반환하고 오류 메시지가 form 객체에 저장된다", "잘못된 값도 그대로 저장된다."], "a": "c", "e": "Django Form에서 `is_valid()`는 입력값이 유효하지 않으면 False를 반환합니다. 이때 발생한 오류 내용은 form 객체의 errors 속성에 저장되어 사용자에게 출력될 수 있습니다. 이 과정은 자동으로 수행되며 서버 에러가 발생하지 않고, 잘못된 값도 저장되지 않습니다."}, {"q": "Form 클래스에서 입력 필드에 placeholder나 class 등 추가 속성을 설정할 수 있는 곳은?", "o": ["fields", "model", "attrs", "exclude"], "a": "c", "e": "입력 필드에 추가 속성(placeholder, class 등)을 지정하려면 Form 클래스의 Widget 내부의 attrs 속성을 사용합니다. 이를 통해 화면에 표시되는 HTML 요소를 세부적으로 제어할 수 있습니다."}, {"q": "다음 중 Django view 함수가 HTTP의 POST 요청을 처리하는 경우로 올바른 것은?", "o": ["화면에 폼을 출력하여 사용자에게 보여준다.", "사용자가 입력한 데이터를 받아서 유효성 검사를 수행한다.", "데이터베이스에 있는 데이터를 화면에 표시한다.", "URL 주소를 통해 직접 화면에 접근할 때 사용된다."], "a": "b", "e": "HTTP POST 요청은 사용자가 입력한 데이터를 서버로 전송하여 처리할 때 사용됩니다. Django에서 POST 요청은 사용자가 제출한 폼 데이터를 받아 유효성 검사를 거쳐 데이터베이스에 저장하거나 처리하는 데 활용됩니다."}], "date": "10/20 AM"}, {"id": "1020S", "title": "Django Static & Media files", "qs": [{"q": "다음 중 정적 파일에 대한 가장 올바른 설명은?", "o": ["사용자가 업로드하는 파일", "서버 측에서 변경 없이 고정적으로 제공되는 파일", "데이터베이스에 저장되는 정보", "사용자에 따라 내용이 바뀌는 파일"], "a": "b", "e": "정적 파일은 사이트 개발자가 미리 준비해 둔 파일로, 서버가 실행되는 동안 내용이 변하지 않고 고정적으로 제공됩니다. (예: CSS, 로고 이미지)"}, {"q": "Django settings.py에서 `STATIC_URL`의 역할은 무엇인가?", "o": ["정적 파일이 저장된 실제 폴더 경로", "웹에서 정적 파일에 접근하기 위한 URL 접두사", "데이터베이스 연결 주소", "미디어 파일 업로드 경로"], "a": "b", "e": "`STATIC_URL`은 실제 파일 시스템 경로가 아닌, 웹 브라우저가 정적 파일에 접근할 때 사용하는 URL의 시작 부분을 정의합니다."}, {"q": "ImageField를 사용한 모델에서 데이터베이스에 실제로 저장되는 것은 무엇인가?", "o": ["이미지 파일의 바이너리 데이터", "이미지 파일의 경로 문자열", "Pillow 라이브러리 객체", "이미지 파일의 base64 인코딩 값"], "a": "b", "e": "Django의 ImageField는 이미지 파일 자체를 DB에 저장하지 않습니다. DB에는 해당 파일이 서버 어디에 저장되어 있는지를 나타내는 경로 정보(문자열)만 저장하여 효율성을 높입니다."}, {"q": "ImageField를 정의할 때, `MEDIA_ROOT` 안에서 파일이 저장될 세부 경로를 지정하는 인자는?", "o": ["`path`", "`default`", "`upload_to`", "`media_path`"], "a": "c", "e": "`upload_to` 인자는 ImageField가 `MEDIA_ROOT` 내에서 파일을 저장할 세부 경로를 지정하는 항목입니다."}, {"q": "article이라는 변수에 ImageField를 가진 객체가 전달되었을 때, 이 이미지를 HTML에 표시하기 위한 `<img>` 태그의 src 속성을 Django 템플릿 태그를 사용하여 완성하시오. (단, ImageField의 인스턴스는 image이다.)", "code": "<img src=\" ___(?)___ \" alt=\"image\">", "o": [], "a": "`{{ article.image.url }}`", "e": "모델의 이미지 필드 객체에서 `.url` 속성을 사용하면 해당 이미지에 접근할 수 있는 전체 URL을 얻을 수 있습니다."}, {"q": "아래 코드에서 ①번과 ②번에 각각 어떤 settings.py 변수가 사용되어야 하는지 작성하시오.", "code": "urlpatterns = [\n    ...\n] + static(①, document_root=②)", "o": [], "a": "① `settings.MEDIA_URL`, ② `settings.MEDIA_ROOT`", "e": "`static()` 함수는 MEDIA_URL(웹 주소)로 들어온 요청을 MEDIA_ROOT(실제 폴더)에 연결해줍니다."}, {"q": "Django 템플릿에서 `{% static %}` 태그를 사용하기 위해 가장 먼저 선언해야 하는 태그는?", "o": ["`{% import static %}`", "`{% prepare static %}`", "`{% use static %}`", "`{% load static %}`"], "a": "d", "e": "`{% static %}` 태그를 사용하려면, 템플릿 최상단에 `{% load static %}`을 선언하여 Django에게 static 관련 태그 라이브러리를 사용하겠다고 알려줘야 합니다."}, {"q": "Django가 정적 파일을 찾을 때, 각 앱의 static 폴더 외에 추가적인 탐색 경로를 지정하는 설정은?", "o": ["`STATIC_PATH`", "`STATIC_ROOT`", "`STATICFILES_DIRS`", "`EXTRA_STATIC_FILES`"], "a": "c", "e": "`STATICFILES_DIRS`는 각 앱의 static/ 디렉토리 외에, Django가 정적 파일을 추가로 찾아볼 경로 목록을 정의하는 설정입니다."}, {"q": "서버에 파일이 존재하더라도, 웹 브라우저가 그 파일을 화면에 표시하기 위해 반드시 필요한 것은?", "o": ["파일의 압축", "데이터베이스 레코드", "해당 파일에 접근 가능한 고유 URL", "파일에 대한 관리자 승인"], "a": "c", "e": "웹의 동작 원리상, 서버 컴퓨터에 파일이 있더라도 브라우저가 그 파일에 접근할 수 있는 고유한 주소(URL)가 없다면 파일을 요청하고 받아올 수 없습니다."}, {"q": "Django의 ImageField를 사용하기 위해 반드시 설치해야 하는 파이썬 이미지 처리 라이브러리의 이름은 무엇인지 작성하시오.", "o": [], "a": "Pillow", "e": "ImageField는 이미지 파일의 유효성 검사 및 정보 처리를 위해 Pillow 라이브러리를 필요로 합니다."}], "date": "10/20 PM"}, {"id": "1027", "title": "Authentication System 01", "qs": [{"q": "HTTP의 특징이 아닌 것을 고르시오.", "o": ["상태 유지 (Stateful)", "무상태 (Stateless)", "웹 데이터 교환의 기초", "비연결 지향 (Connectionless)"], "a": "a", "e": "HTTP는 상태를 유지하지 않는 무상태(Stateless) 프로토콜입니다."}, {"q": "서버가 브라우저에 보내는 작은 데이터 조각은?", "o": ["캐시 (Cache)", "쿠키 (Cookie)", "세션 (Session)", "프로토콜 (Protocol)"], "a": "b", "e": "쿠키는 서버가 사용자의 웹 브라우저에 전송하는 작은 데이터 조각입니다."}, {"q": "쿠키의 주된 사용 목적이 아닌 것은?", "o": ["세션 관리", "사용자 개인화", "사용자 행동 추적", "데이터베이스 역할"], "a": "d", "e": "쿠키는 간단한 데이터를 저장하며, 데이터베이스를 대체할 수 없습니다."}, {"q": "서버 측에서 사용자 상태를 저장하는 기술은?", "o": ["캐시 (Cache)", "쿠키 (Cookie)", "세션 (Session)", "로컬 스토리지"], "a": "c", "e": "세션은 서버 측에서 클라이언트와의 상태를 유지하고 정보를 저장합니다."}, {"q": "세션 ID는 어디에 저장되어 전달되는가?", "o": ["URL 파라미터", "서버 데이터베이스", "쿠키", "자바스크립트 변수"], "a": "c", "e": "서버가 발급한 세션 ID는 쿠키에 저장되어 클라이언트와 서버 간에 전달됩니다."}, {"q": "Django의 기본 User 모델에 없는 필드는?", "o": ["password", "phone_number", "username", "email"], "a": "b", "e": "전화번호와 같은 추가 정보는 기본 User 모델에 없어 커스텀이 필요합니다."}, {"q": "커스텀 User 모델 설정은 언제 해야하는가?", "o": ["프로젝트 중간", "기능 개발 완료 후", "데이터베이스 마이그레이션 후", "프로젝트 시작 시"], "a": "d", "e": "Django는 프로젝트 시작 시 커스텀 User 모델 설정을 강력히 권장합니다."}, {"q": "Django에서 사용자 인증에 사용되는 폼은?", "o": ["`CustomForm`", "`AuthenticationForm`", "`ModelForm`", "`UserCreationForm`"], "a": "b", "e": "AuthenticationForm은 사용자 로그인(인증)을 위해 사용되는 내장 폼입니다."}, {"q": "로그인 성공 후 세션을 생성하는 함수는?", "o": ["`start_session()`", "`authenticate()`", "`login()`", "`session_create()`"], "a": "c", "e": "auth 모듈의 `login()` 함수가 인증된 사용자의 세션을 생성하고 로그인 처리합니다."}, {"q": "커스텀 User 모델을 지정하는 설정 항목은?", "o": ["`USER_MODEL_AUTH`", "`DJANGO_USER_MODEL`", "`CUSTOM_USER_MODEL`", "`AUTH_USER_MODEL`"], "a": "d", "e": "settings.py 파일에서 `AUTH_USER_MODEL`에 커스텀 모델 경로를 지정합니다."}, {"q": "HTTP의 '무상태(stateless)'란?", "o": ["이전 요청 정보를 유지하지 않음", "서버가 클라이언트 정보를 기억함", "연결을 계속 유지함", "모든 요청은 다르게 처리됨"], "a": "a", "e": "연결이 끊어지면 통신이 끝나며, 이전 요청의 상태 정보가 유지되지 않습니다."}, {"q": "쿠키와 세션의 공통적인 목적은?", "o": ["서버 부하 감소", "데이터 영구 저장", "빠른 데이터 전송", "상태 정보 유지 및 사용자 식별"], "a": "d", "e": "두 기술 모두 상태가 없는 HTTP에서 상태를 유지하고 사용자를 구분하기 위해 사용됩니다."}], "date": "10/27"}, {"id": "1028A", "title": "Authentication System 02", "qs": [{"q": "로그아웃의 역할로 가장 올바른 것은?", "o": ["세션 데이터만 삭제", "클라이언트 쿠키만 삭제", "세션 데이터와 쿠키 모두 처리", "사용자 계정 정보 삭제"], "a": "c", "e": "로그아웃은 서버의 세션 데이터를 삭제하고, 클라이언트의 쿠키에 저장된 세션 ID도 삭제하여 연결을 완전히 끊는 과정입니다."}, {"q": "회원가입 기능에 사용하는 Django 내장 폼은?", "o": ["`AuthenticationForm`", "`UserCreationForm`", "`UserChangeForm`", "`CustomUserForm`"], "a": "b", "e": "UserCreationForm은 새로운 사용자를 생성(회원가입)하기 위해 Django에서 기본으로 제공하는 ModelForm입니다."}, {"q": "`get_user_model()` 함수를 사용하는 가장 큰 이유는?", "o": ["사용자 객체를 삭제하기 위해", "비밀번호를 암호화하기 위해", "활성화된 User 모델을 참조하기 위해", "모든 사용자 정보를 조회하기 위해"], "a": "c", "e": "프로젝트의 User 모델이 기본이든 커스텀이든, 현재 활성화된 모델을 동적으로 가져와 코드의 유연성과 재사용성을         ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
        ${body}
        <p class="exp" data-exp="${id}"><b>${q.o.length ? '정답 '+q.a+')' : '해설'}</b> · ${md(q.e)}</p>
      </article>`;
    }).join('')}
  </section>`).join('');
  apply();
}

function apply(){
  document.getElementById('m-study').setAttribute('aria-pressed', mode==='study');
  document.getElementById('m-test').setAttribute('aria-pressed', mode==='test');
  document.getElementById('reset').hidden = mode !== 'test';
  document.querySelectorAll('.q').forEach(el => {
    const id = el.dataset.id, show = mode==='study' || answered[id] !== undefined;
    el.querySelectorAll('.opt').forEach(b => {
      b.classList.toggle('is-ans', show && b.dataset.k===b.dataset.a);
      b.classList.toggle('is-wrong', mode==='test' && answered[id]===b.dataset.k && b.dataset.k!==b.dataset.a);
      b.disabled = mode==='study' || answered[id] !== undefined;
    });
    const a = el.querySelector('[data-ans]'); if (a) a.hidden = !show;
    const sb = el.querySelector('.sa-btn'); if (sb) sb.hidden = show;
    el.querySelector('[data-exp]').hidden = !show;
  });
  score();
}
function score(){
  const s = document.getElementById('score');
  if (mode==='study'){ s.textContent = `${DATA.length}개 강의 · 113문항`; return; }
  const ids = Object.keys(answered), mc = ids.filter(i => answered[i] !== 'sa');
  const ok = mc.filter(i => { const [l,n]=i.split('-'); const q = DATA.find(d=>d.id===l).qs[+n]; return q.a===answered[i]; }).length;
  s.textContent = `푼 문항 ${ids.length} / 113 · 객관식 정답 ${ok} / ${mc.length}`;
}
document.addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (o && mode==='test' && answered[o.dataset.q]===undefined){ answered[o.dataset.q]=o.dataset.k; apply(); return; }
  const sb = e.target.closest('.sa-btn');
  if (sb){ answered[sb.dataset.q]='sa'; apply(); }
});
function setMode(m){ mode=m; try{localStorage.setItem('dq-mode',m)}catch(e){} apply(); }
document.getElementById('m-study').onclick = () => setMode('study');
document.getElementById('m-test').onclick = () => setMode('test');
document.getElementById('reset').onclick = () => { for (const k in answered) delete answered[k]; apply(); };
const pop = document.getElementById('pop'), tb = document.getElementById('tocbtn'), totopBtn = document.getElementById('totop');
function setPop(open){ pop.hidden = !open; tb.setAttribute('aria-expanded', open); }
tb.onclick = e => { e.stopPropagation(); setPop(pop.hidden); };
pop.addEventListener('click', e => { if (e.target.closest('a')) setPop(false); });
document.addEventListener('click', e => { if (!pop.hidden && !e.target.closest('#pop')) setPop(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setPop(false); });
totopBtn.onclick = () => window.scrollTo({top:0});
let ticking = false;
function onScroll(){
  ticking = false;
  totopBtn.hidden = window.scrollY < 500;
  let cur = DATA[0];
  for (const d of DATA){ const el = document.getElementById('l'+d.id); if (el && el.getBoundingClientRect().top <= 120) cur = d; }
  document.getElementById('cur').textContent = cur.date + ' ' + cur.title;
  document.querySelectorAll('a[data-l]').forEach(a => a.classList.toggle('on', a.dataset.l === cur.id));
}
window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, {passive:true});
render(); onScroll();
</script>

</body></html>
